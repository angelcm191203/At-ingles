<div class="admin-container">
  <header class="header">
    <h2>Panel de Administración</h2>
    <button class="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <div class="card">
    <h3>Importar Excel de Alumnos</h3>
    <p class="subtitle">Selecciona el archivo Excel con los datos que visualizarán los docentes.</p>

    <div class="upload-section">
      <input type="file" (change)="onFileSelected($event)" id="fileInput" class="file-input" />
      <button class="btn-primary" (click)="subirExcel()">Subir Excel</button>
    </div>

    <p *ngIf="mensaje" class="mensaje-alerta">{{ mensaje }}</p>
  </div>
</div>
