<div class="login-container" [class.login-mode]="isLoginMode">
  
  <!-- Contenedor general de los formularios -->
  <div class="forms-container">
    <div class="signin-signup">

  
   <!-- Formulario de Registro (Izquierda) -->
<form class="sign-up-form" (ngSubmit)="onRegister()" #fReg="ngForm">
  <div class="logo-section">
    <img src="/logo ci.png.jpeg" alt="Logo Coordinación de Inglés" class="logo-img">
  </div>
  <h2 class="title">Crear Cuenta</h2>
  
  <div class="input-field">
    <input type="text" placeholder="Nombre completo" [(ngModel)]="registroData.nombre_completo" name="nombreReg" #nombreReg="ngModel" minlength="3" required />
  </div>
  
  <div class="input-field">
    <input type="text" placeholder="Número de empleado" [(ngModel)]="registroData.numero_empleado" name="numEmpleadoReg" #numEmpleadoReg="ngModel" required />
  </div>
  
  <div class="input-field">
    <!-- max length de 4 evita que escriban de más y type="password" oculta los caracteres -->
    <input type="password" placeholder="Contraseña (4 letras de tu CURP)" [(ngModel)]="registroData.contrasena" name="passReg" #passReg="ngModel" maxlength="4" minlength="4" required />
  </div>
  
  <!-- Se bloquea si el formulario es inválido o si la contraseña no tiene 4 caracteres -->
 <button type="submit" class="btn solid">Registrarse</button>
</form>
      <!-- ¡Aquí faltaba cerrar el formulario de registro! -->

      <!-- Formulario de Iniciar Sesión (Derecha) -->
      <form class="sign-in-form" (ngSubmit)="onLogin()" #fLog="ngForm">
        <div class="logo-section">
          <img src="/logo ci.png.jpeg" alt="Logo Coordinación de Inglés" class="logo-img">
        </div>
        <h2 class="title">Iniciar Sesión</h2>
        
        <div class="input-field">
          <input type="text" placeholder="Numero de empleado" [(ngModel)]="loginData.numero_empleado" name="numEmpleadoLog" #numEmpleadoLog="ngModel" required />
        </div>
        
        <div class="input-field">
          <input type="password" placeholder="Contraseña" [(ngModel)]="loginData.contrasena" name="passLog" #passLog="ngModel" required />
        </div>
        
        <button type="submit" class="btn solid">Ingresar</button>
      </form>

    </div>
  </div>

  <!-- Apartado de leyendas y paneles laterales -->
  <div class="panels-container">
    
    <!-- Apartado de leyenda registro -->
    <div class="panel left-panel">
      <h3>¿Nuevo por aquí?</h3>
      <p>Regístrate para formar parte de la plataforma de la Coordinación de Inglés y accede a todos los recursos.</p>
      <button class="btn transparent" type="button" (click)="toggleMode(false)">
        Registrarse
      </button>
    </div>

    <!-- Apartado de leyenda iniciar sesión -->
    <div class="panel right-panel">
      <h3>¿Ya tienes una cuenta?</h3>
      <p>Inicia sesión con tus credenciales para continuar con tus actividades y clases.</p>
      <button class="btn transparent" type="button" (click)="toggleMode(true)">
        Iniciar Sesión
      </button>
    </div>

  </div>

</div>
